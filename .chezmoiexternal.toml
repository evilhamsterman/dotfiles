[".claude/skills/chezmoi"]
    type = "git-repo"
    url = "https://github.com/cosgroveb/chezmoi-skill.git"
    refreshPeriod = "168h"

{{ if and (eq .chezmoi.os "linux") (not (eq .chezmoi.osRelease.id "arch" "archarm" "cachyos")) -}}
{{ $arch := ternary "aarch64" "x86_64" (eq .chezmoi.arch "arm64") -}}
[".local/bin/starship"]
    type = "archive-file"
    url = {{ gitHubLatestReleaseAssetURL "starship/starship" (printf "starship-%s-unknown-linux-musl.tar.gz" $arch) | quote }}
    path = "starship"
    executable = true
    refreshPeriod = "168h"
{{ end -}}
